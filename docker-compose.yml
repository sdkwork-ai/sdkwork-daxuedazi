# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DSH_IMAGE:-localhost/deepseek-harness:local}
    restart: unless-stopped
    # The container reads the deployment's committed per-environment file
    # directly — the same `etc/topology/<profile>.<environment>.env` the deploy
    # descriptor selects (ENVIRONMENT_SPEC §5.1.7). Override the two variables
    # to run another tier without editing this file.
    env_file:
      - ./etc/topology/${SDKWORK_DEPLOYMENT_PROFILE:-cloud}.${SDKWORK_ENVIRONMENT:-production}.env
    ports:
      # Keep the unauthenticated direct listener on loopback. A reverse proxy
      # on the Compose network can reach the service without publishing it.
      # The third field is the port INSIDE the container, so an install can
      # move the whole listener (DSH_WEB_PORT) and not just its host mapping;
      # the healthcheck below reads the same variable so both stay in step.
      - "${DSH_PUBLISH_HOST:-127.0.0.1}:${DSH_PUBLISH_PORT:-4080}:${DSH_WEB_PORT:-4080}"
    environment:
      # Null mapping values pass a host/.env value when present and omit the
      # variable otherwise, preserving the provider's public-endpoint default.
      DEEPSEEK_API_KEY:
      DEEPSEEK_BASE_URL:
      DEEPSEEK_SEARCH_BASE_URL:
      DSH_HOME: /data
      DSH_WEB_HOST: 0.0.0.0
      # Installation-time override for the container listener; the entrypoint
      # validates 1-65535 and refuses anything else.
      DSH_WEB_PORT: "${DSH_WEB_PORT:-4080}"
      DSH_ALLOW_NON_LOOPBACK: "1"
      # Comma-separated browser Host authorities, for example app.example.com.
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-localhost,127.0.0.1}
      DSH_TELEMETRY_DISABLED: "1"
      DSH_PERMISSION_MODE: workspace-write
    volumes:
      # A value with a path makes these bind mounts, so an installation can put
      # its data and workspace wherever the host keeps persistent state; the
      # default keeps the managed named volumes.
      - ${DSH_DATA_DIR:-dsh-data}:/data
      - ${DSH_WORKSPACE_DIR:-dsh-workspace}:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Same variable as the published port, so a moved listener still probes
      # the port it actually opened.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:${DSH_WEB_PORT:-4080}/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 2400s
      retries: 10
    logging: *default-logging

volumes:
  dsh-data:
  dsh-workspace:
